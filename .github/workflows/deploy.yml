name: Deploy to GitHub Pages

# 推到 main：測試 → 建置 → 部署。
# 開 Pull Request（目標是 main）：只跑測試與建置，不部署；結果會顯示在 PR 頁面上。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一個 PR 有新的 commit 時，取消舊的檢查；部署則同一時間只跑一個
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # 端對端測試（Chromium＋WebKit）：連線對戰、斷線重連、手機觸控、設定、跨瀏覽器決定性（本機 PeerJS 信令伺服器）
      # 執行環境內建的 Microsoft 套件來源偶爾會 403，導致 apt 更新失敗；遊戲用不到它，先移除
      - run: sudo rm -f /etc/apt/sources.list.d/*microsoft* || true
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results
      - run: npm run build
        env:
          # 成效追蹤（選用）：在 repo 的 Settings → Secrets and variables → Actions → Variables 設定，沒設定就不追蹤
          VITE_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
          VITE_GOATCOUNTER: ${{ vars.GOATCOUNTER }}
          # 線上對戰的中繼伺服器（選用）：手機 4G 對家裡 Wi-Fi 等無法直連時需要，說明見 src/net/ice.ts
          VITE_TURN_ENDPOINT: ${{ vars.TURN_ENDPOINT }}
          VITE_TURN_URLS: ${{ vars.TURN_URLS }}
          VITE_TURN_USER: ${{ vars.TURN_USER }}
          VITE_TURN_CRED: ${{ vars.TURN_CRED }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
